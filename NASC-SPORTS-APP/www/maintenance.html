<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex">
  <title>Under Maintenance · NASC SPORTS</title>
  <style>
    :root{--dark:#0b1220;--gold:#b9924b;--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(1200px 600px at 50% -10%,#16202f 0%,#0b1220 55%);display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:460px;display:flex;flex-direction:column;align-items:center;gap:18px}
    .mark{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--gold);color:#0b1220;font-weight:900;font-size:30px}
    h1{margin:0;font-size:34px;letter-spacing:-.02em;line-height:1.05}
    h1 small{display:block;color:var(--gold);letter-spacing:.34em;font-size:15px;margin-top:6px}
    h2{margin:12px 0 0;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
    p{margin:0;color:#c6cdd9;font-size:16px;line-height:1.7}
    .pulse{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(185,146,75,.6);animation:p 2s infinite}
    @keyframes p{70%{box-shadow:0 0 0 14px rgba(185,146,75,0)}100%{box-shadow:0 0 0 0 rgba(185,146,75,0)}}
  </style>
</head>
<body>
  <div class="box">
    <span class="mark">N</span>
    <h1>NASC <small>SPORTS</small></h1>
    <h2>Under Maintenance</h2>
    <p>{{MESSAGE}}<br><span>Please check back soon.</span></p>
    <span class="pulse"></span>
  </div>
</body>
</html>
